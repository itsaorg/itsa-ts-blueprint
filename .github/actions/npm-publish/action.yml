name: npm publish
description: Direct npm publish (emergency/manual only — normal releases use npm-stage-publish).

inputs:
  reason:
    description: Why direct publish is required (logged for audit)
    required: true

runs:
  using: composite
  steps:
    - name: Log direct publish reason
      shell: bash
      run: echo "Direct npm publish requested — reason:${{ inputs.reason }}"

    - name: Publish to npm
      shell: bash
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
