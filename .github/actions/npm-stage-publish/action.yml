name: npm stage publish
description: Stage the current package version on npm for maintainer approval (Option B publish model).

runs:
  using: composite
  steps:
    - name: Stage package on npm
      shell: bash
      run: node scripts/stage-publish.mjs
      env:
        NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

    - name: Staged packages link
      shell: bash
      run: |
        echo "Review and approve staged releases at:"
        echo "https://www.npmjs.com/settings/~/packages/staged"
