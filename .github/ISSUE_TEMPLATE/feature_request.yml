name: Feature request
description: Propose a new capability or enhancement
title: '[Feature] '
labels: ['enhancement']
body:
  - type: input
    id: repo_id
    attributes:
      label: Repo ID
      description: Catalog ID from MVP.md (e.g. R1, R23, A1)
      placeholder: R1
    validations:
      required: true
  - type: input
    id: mvp_phase
    attributes:
      label: MVP phase
      description: Target phase gate (e.g. P1, P7)
      placeholder: P1
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior or API
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Bullet list of verifiable outcomes
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Links, diagrams, dependencies, or MVP task references
