name: Bug report
description: Report incorrect behavior or a regression
title: '[Bug] '
labels: ['bug']
body:
  - type: input
    id: repo_id
    attributes:
      label: Repo ID (optional)
      description: Catalog ID if your org uses one
      placeholder: R1
  - type: input
    id: mvp_phase
    attributes:
      label: Phase (optional)
      description: Related phase gate if applicable
      placeholder: P1
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package or release version
      placeholder: 1.0.0
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Node 24.21.0, OS, CI run URL, etc.
