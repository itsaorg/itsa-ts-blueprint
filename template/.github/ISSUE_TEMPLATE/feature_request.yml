name: Feature request
description: Propose a new capability or enhancement
title: '[Feature] '
labels: ['enhancement']
body:
  - type: input
    id: repo_id
    attributes:
      label: Repo ID (optional)
      description: Catalog ID if your org uses one
      placeholder: R1
  - type: input
    id: mvp_phase
    attributes:
      label: Phase (optional)
      description: Target phase gate if applicable
      placeholder: P1
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior or API
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Bullet list of verifiable outcomes
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Links, diagrams, or dependencies
