name: Chore or docs
description: Tooling, maintenance, documentation, or refactor work
title: '[Chore] '
labels: ['chore']
body:
  - type: input
    id: repo_id
    attributes:
      label: Repo ID (optional)
      description: Catalog ID if your org uses one
      placeholder: R0
  - type: input
    id: mvp_phase
    attributes:
      label: Phase (optional)
      description: Related phase gate if applicable
      placeholder: P0
  - type: dropdown
    id: change_type
    attributes:
      label: Change type
      options:
        - Documentation
        - Tooling / CI
        - Refactor
        - Dependency update
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to change and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true
